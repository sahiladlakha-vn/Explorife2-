<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Warm dusk over a bay with limestone islands">
  <!--
    Generated illustration used as the admin dashboard backdrop (blurred and
    darkened by CSS). Original artwork, no third-party assets. To use a real
    photograph instead, replace the url() in `.admin-dashboard-scene`
    (app/globals.css) with a JPEG.

    Kept deliberately deep: the brightest tone is an ember amber, with no
    cream or white anywhere, so white text on the frosted glass cards stays
    legible wherever the scene happens to sit behind them.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160e24"/>
      <stop offset="0.32" stop-color="#381a3c"/>
      <stop offset="0.58" stop-color="#6b2c38"/>
      <stop offset="0.8" stop-color="#934d2d"/>
      <stop offset="1" stop-color="#9e6131"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86452e"/>
      <stop offset="0.35" stop-color="#52263c"/>
      <stop offset="1" stop-color="#170e24"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b8743a" stop-opacity="0.45"/>
      <stop offset="0.25" stop-color="#a8632c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a34f23" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunDisc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a8743f"/>
      <stop offset="1" stop-color="#9a5f30"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softer" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- clouds -->
  <g filter="url(#soft)" fill="#a36a54" opacity="0.32">
    <ellipse cx="420" cy="250" rx="300" ry="38"/>
    <ellipse cx="620" cy="300" rx="240" ry="30"/>
    <ellipse cx="1440" cy="210" rx="340" ry="42"/>
    <ellipse cx="1620" cy="270" rx="250" ry="30"/>
  </g>

  <!-- sun -->
  <circle cx="1010" cy="650" r="460" fill="url(#sunGlow)"/>
  <circle cx="1010" cy="655" r="120" fill="url(#sunDisc)"/>

  <!-- far limestone islands -->
  <g fill="#8b4338" opacity="0.5">
    <path d="M80 710 C100 620 120 520 160 500 C200 480 215 560 240 620 C255 655 270 685 285 710Z"/>
    <path d="M330 710 C350 640 380 560 420 548 C460 540 470 620 490 660 C500 685 505 698 510 710Z"/>
    <path d="M1500 710 C1530 630 1560 540 1610 520 C1655 505 1680 600 1700 650 C1712 685 1720 698 1730 710Z"/>
    <path d="M1740 710 C1760 650 1790 590 1830 585 C1870 580 1890 640 1900 710Z"/>
  </g>

  <!-- mid islands -->
  <g fill="#5c2c45" opacity="0.85">
    <path d="M-20 712 C30 640 70 560 130 540 C190 520 230 600 270 655 C300 690 330 702 360 712Z"/>
    <path d="M1380 712 C1420 620 1470 520 1540 500 C1610 480 1650 570 1690 645 C1710 680 1740 702 1770 712Z"/>
  </g>

  <!-- sea -->
  <rect y="708" width="1920" height="372" fill="url(#sea)"/>

  <!-- sun reflection -->
  <g filter="url(#softer)" fill="#b68852">
    <ellipse cx="1010" cy="735" rx="130" ry="9" opacity="0.38"/>
    <ellipse cx="1010" cy="775" rx="105" ry="8" opacity="0.3"/>
    <ellipse cx="1010" cy="820" rx="82" ry="7" opacity="0.24"/>
    <ellipse cx="1010" cy="870" rx="60" ry="6" opacity="0.18"/>
    <ellipse cx="1010" cy="925" rx="40" ry="5" opacity="0.12"/>
  </g>

  <!-- foreground islands -->
  <g fill="#231227">
    <path d="M-40 780 C10 700 40 560 100 520 C150 490 190 560 220 640 C240 700 250 745 262 790Z"/>
    <path d="M1700 790 C1730 700 1770 560 1830 520 C1890 485 1940 560 1960 640 L1960 790Z"/>
  </g>

  <!-- two small boats -->
  <g fill="#170c1b" opacity="0.85">
    <path d="M760 735 L820 735 L810 748 L772 748Z"/>
    <path d="M788 735 L788 700 L812 733Z"/>
    <path d="M1220 760 L1270 760 L1262 770 L1230 770Z"/>
    <path d="M1244 760 L1244 734 L1262 758Z"/>
  </g>
</svg>
